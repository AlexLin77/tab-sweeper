<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Sweeper</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="" width="22" height="22" />
        <div>
          <h1>Tab Sweeper</h1>
          <p id="summary" class="muted">Loading…</p>
        </div>
      </div>
      <div class="top-actions">
        <label class="switch" title="Automatically sweep idle tabs">
          <input type="checkbox" id="enabled" />
          <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          <span>Auto</span>
        </label>
        <button id="open-options" class="icon-btn" title="Settings" aria-label="Settings"></button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search tabs" autocomplete="off" spellcheck="false" autofocus />
      <select id="sort" aria-label="Sort tabs">
        <option value="stale">Least recent</option>
        <option value="recent">Most recent</option>
        <option value="window">Tab order</option>
      </select>
    </div>

    <nav class="views" role="tablist">
      <button role="tab" data-view="open" aria-selected="true">Open <span class="count" id="count-open"></span></button>
      <button role="tab" data-view="closed" aria-selected="false">
        Recently closed <span class="count" id="count-closed"></span>
      </button>
    </nav>

    <main id="scroller">
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
    </main>

    <footer class="bottom">
      <div id="footer-open" class="footer-row">
        <button id="sweep-now" class="btn primary">Sweep idle tabs</button>
        <button id="close-dupes" class="btn">Close duplicates</button>
      </div>
      <div id="footer-closed" class="footer-row" hidden>
        <span id="stats" class="muted"></span>
        <button id="clear-history" class="btn">Clear list</button>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
